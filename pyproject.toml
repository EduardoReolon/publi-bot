[project]
name = "publibot"
version = "0.1.0"
description = "Orquestrador de conteudo SEO fundamentado em literatura cientifica"
requires-python = ">=3.12"

# ---------------------------------------------------------------------------
# Ruff — lint e formatacao
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["migrations", "venv", ".venv"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort — ordem de imports
    "UP",   # pyupgrade — sintaxe moderna
    "B",    # bugbear — armadilhas comuns
    "C4",   # comprehensions
    "DJ",   # regras especificas de Django
    "S",    # bandit — seguranca
    "T20",  # proibe print() em codigo de producao
    "RUF",
]
ignore = [
    "S101",  # assert: legitimo dentro de teste
    "RUF012",# ClassVar em atributos mutaveis de classe: ruidoso com Django
]

[tool.ruff.lint.per-file-ignores]
# Settings sao, por natureza, um monte de constante importada com *.
"core/settings/*.py" = ["F403", "F405", "E501"]
# Testes podem usar print e credencial de mentira.
"**/tests/**" = ["S105", "S106", "T20"]
"**/test_*.py" = ["S105", "S106", "T20"]
# Scripts utilitarios podem imprimir.
"scripts/*.py" = ["T20"]
"convert_requirements.py" = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "core"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "core.settings.dev"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["tests", "apps"]

# Os testes de contrato rodam com outro settings (o no de referencia e um site
# comum, sem multi-tenancy), entao ficam fora do testpaths padrao. Rode com:
#   pytest tests_contrato/ --ds=core.settings.test_contract
norecursedirs = ["tests_contrato", "docs", "venv", ".model_cache"]
addopts = "-ra --strict-markers -m 'not integration'"
markers = [
    "integration: exige o modelo de embedding real, ou servicos externos de verdade",
]

# Os testes de integracao carregam ~2 GB e sao excluidos por padrao.
# Rode-os com: pytest -m integration

filterwarnings = [
    "error::DeprecationWarning",
    # Django 6.0 muda o esquema padrao de URLField em formularios de http para
    # https. O aviso e emitido pelo Django ao construir formularios do admin a
    # partir de qualquer URLField, em varios apps. Nao afeta comportamento
    # agora, e o comportamento futuro (https) e justamente o desejado — o
    # contrato de integracao exige TLS. Some sozinho na atualizacao para 6.x.
    # Perseguir isso hoje exigiria remendo em cada ModelAdmin, o que e pior que
    # o aviso. Registrado aqui em vez de escondido.
    "ignore:The default scheme will be changed:DeprecationWarning",
]

[tool.coverage.run]
source = ["apps", "core"]
omit = ["*/migrations/*", "*/tests/*"]
