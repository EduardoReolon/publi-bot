# Nginx para o PubliBot.
#
# Molde: o release.sh troca __DOMINIO__ (ROOT_DOMAIN), __RAIZ__ e __MIDIA__
# (MEDIA_ROOT) e instala em sites-available, depois de conferir com nginx -t.
# O curinga e obrigatorio: cada tenant vive num subdominio.

upstream publibot_app {
    server unix:/run/publibot/publibot.sock fail_timeout=0;
    keepalive 32;
}

# Redireciona texto claro. O certificado precisa ser curinga para cobrir os
# subdominios dos tenants.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMINIO__ *.__DOMINIO__;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __DOMINIO__ *.__DOMINIO__;

    ssl_certificate     /etc/letsencrypt/live/__DOMINIO__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMINIO__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # PDFs cientificos passam facil de 10 MB. O default do Nginx e 1 MB, e o
    # upload falharia com 413 antes de chegar a aplicacao.
    client_max_body_size 50M;
    client_body_timeout 120s;

    # Maior que o timeout do Gunicorn, para o Nginx nao desistir de uma
    # requisicao que o app ainda esta processando.
    proxy_read_timeout 130s;
    proxy_connect_timeout 10s;

    access_log /var/log/nginx/publibot.access.log;
    error_log  /var/log/nginx/publibot.error.log;

    location /static/ {
        alias __RAIZ__/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # `internal` significa que esta rota SO pode ser alcancada por um
    # X-Accel-Redirect emitido pela aplicacao. Sem isso, os PDFs de todos os
    # tenants ficariam servidos publicamente por URL adivinhavel.
    location /protected-media/ {
        internal;
        alias __MIDIA__/;
    }

    # As sondas nao entram no log de acesso: sao consultadas a cada poucos
    # segundos e afogariam qualquer coisa util.
    location = /healthz/ {
        proxy_pass http://publibot_app;
        access_log off;
    }

    location / {
        proxy_pass http://publibot_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Sem este cabecalho o Django nao sabe que a requisicao chegou por
        # HTTPS, e SECURE_SSL_REDIRECT entra em laco infinito de redirecionamento.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        # Identificador que atravessa Nginx, aplicacao e worker.
        proxy_set_header X-Request-ID      $request_id;
    }
}
