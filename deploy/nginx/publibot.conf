# Nginx para o PubliBot.
#
# Molde: o release.sh troca __DOMINIO__ (ROOT_DOMAIN), __RAIZ__ e __MIDIA__
# (MEDIA_ROOT) e instala em sites-available, depois de conferir com nginx -t.
# O curinga e obrigatorio: cada tenant vive num subdominio.

upstream publibot_app {
    server unix:/run/publibot/publibot.sock fail_timeout=0;
    keepalive 32;
}

# Redireciona texto claro. O certificado precisa ser curinga para cobrir os
# subdominios dos tenants.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMINIO__ *.__DOMINIO__;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS em dois blocos, porque o dominio raiz e os subdominios podem vir de
# certificados diferentes: `*.__DOMINIO__` NAO cobre o proprio __DOMINIO__. O
# release.sh acha o certificado que cobre a raiz (o da pasta __DOMINIO__, se
# ele tiver a raiz; senao, outro em /etc/letsencrypt/live que a cubra, como um
# curinga do dominio pai) e troca __CERT_RAIZ__. O resto e igual nos dois e
# mora em snippets/publibot-comum.conf (deploy/nginx/publibot-comum.conf).
server {
    # `http2` no listen, e nao `http2 on;`: a diretiva nova so existe a partir
    # do Nginx 1.25, e o do Ubuntu 24.04 e o 1.24 (nginx -t recusaria). Nas
    # versoes novas isto so gera um aviso.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMINIO__;

    ssl_certificate     /etc/letsencrypt/live/__CERT_RAIZ__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__CERT_RAIZ__/privkey.pem;
    include /etc/nginx/snippets/publibot-comum.conf;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name *.__DOMINIO__;

    ssl_certificate     /etc/letsencrypt/live/__DOMINIO__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMINIO__/privkey.pem;
    include /etc/nginx/snippets/publibot-comum.conf;
}
