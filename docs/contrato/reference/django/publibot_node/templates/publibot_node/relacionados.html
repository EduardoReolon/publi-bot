{% comment %}
  Os links internos escolhidos pelo PubliBot. Sobrescreva no seu projeto para
  mudar o visual; mantenha links comuns (<a href>), que o Google segue.
{% endcomment %}
{% if relacionados %}
<nav class="publibot-relacionados" aria-label="Leia tambem">
  <h2>Leia tambem</h2>
  <ul>
    {% for item in relacionados %}<li><a href="{{ item.url }}">{{ item.title }}</a></li>{% endfor %}
  </ul>
</nav>
{% endif %}
