Vetoriza paragrafos, busca por similaridade e mede se a busca esta saudavel. O
limiar de distancia vive por tenant e e calibrado por medicao, nunca herdado de
recomendacao generica.
"""
entrada = ["apps/knowledge/services.py", "apps/knowledge/embeddings.py"]
relacionados = ["acervo-extracao", "geracao-texto"]
padroes = [
  "apps/knowledge/embeddings.py",
