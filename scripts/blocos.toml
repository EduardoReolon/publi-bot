  "apps/knowledge/saude.py",
  "tests/test_knowledge.py",
  "tests/test_saude_da_busca.py",
  "tests/test_pgvector.py",
  "tests/test_embeddings_reais.py",
]

[[bloco]]
nome = "acervo-telas"
titulo = "Telas do acervo: envio, curadoria e qualidade da busca"
resumo = """
Onde uma pessoa envia documento, confere o que a extracao propos, marca os
blocos que valem virar vetor e calibra o limiar olhando as distancias reais.
"""
entrada = ["apps/knowledge/views.py"]
