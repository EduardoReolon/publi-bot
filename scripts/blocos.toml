# Blocos de contexto: quais arquivos viajam juntos quando o projeto e
# explicado a uma IA de contexto pequeno.
#
# ---------------------------------------------------------------------------
# COMO A ATRIBUICAO FUNCIONA — leia antes de mexer
# ---------------------------------------------------------------------------
#
# 1. Blocos sao avaliados NA ORDEM em que aparecem aqui. O primeiro padrao que
#    casar leva o arquivo. Por isso os blocos especificos vem antes dos gerais.
#
# 2. O ultimo padrao de cada area e um CURINGA (`apps/content/**`, por exemplo).
#    E ele que cumpre a promessa de "adicionei um arquivo e ele ja entra no
#    bloco certo": um modulo novo em `apps/content/` cai no bloco daquela area
#    sem ninguem editar este arquivo.
#
# 3. NAO existe curinga global, de proposito. Um diretorio inteiramente novo
#    (`apps/faturamento/`, digamos) fica orfao, e `gerar_blocos.py` falha
#    dizendo o nome do arquivo. Um curinga global transformaria isso em
#    silencio, e o arquivo novo iria parar num bloco onde ninguem o procuraria.
#
# Ao acrescentar um bloco: ponha-o ANTES do curinga da area a que pertence.

# ---------------------------------------------------------------------------
# Fora de qualquer bloco
# ---------------------------------------------------------------------------
# Arquivos que existem no repositorio e nao ajudam a explicar nada. Migrations
# sao geradas pelo Django e sao longas; o modelo que as originou esta no bloco
# e diz a mesma coisa em menos linhas.
ignorar = [
  "**/migrations/**",
  "**/__pycache__/**",
  "**/__init__.py",
  "**/*.pyc",
  "**/*.po",
  "**/*.mo",
  "locale/**",
  "fixtures/**",
  "media/**",
  # A propria saida. Se um dia for versionada, sem esta linha os blocos
  # entrariam no bloco `decisoes` (que casa `docs/**`) e dobrariam de tamanho a
  # cada geracao.
  "docs/blocos/**",
  "**/.gitkeep",
  ".gitignore",
  ".gitattributes",
  ".pre-commit-config.yaml",
  "convert_requirements.py",
  "NOTICE.md",
  "dump.rdb",
]

# Tudo que casar aqui so entra com `--com-testes`. Sao a melhor explicacao do
# comportamento que existe no projeto, e tambem dobram o tamanho do bloco.
padroes_de_teste = ["tests/**", "tests_contrato/**", "**/test_*.py"]


