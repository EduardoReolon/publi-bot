titulo = "Geracao do artigo em rodadas curtas"
resumo = """
Planeja o artigo, escreve uma secao por chamada e so no fim monta abertura,
fecho e metadados. Feito em rodadas porque um modelo pequeno escreve bem um
trecho com tres fontes na frente, e mal um artigo inteiro com quinze.

Contem tambem a regra de embasamento: a ideia central sai de um artigo de
referencia, os paragrafos ao redor podem usar conhecimento geral.
"""
