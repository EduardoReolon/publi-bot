# apps/knowledge — o acervo
# ---------------------------------------------------------------------------
[[bloco]]
nome = "acervo-extracao"
titulo = "Leitura de PDF: extracao, blocos e metadados"
resumo = """
Transforma um PDF enviado em texto, detecta secoes e propoe titulo, autores,
ano e DOI. E a parte mais heuristica do projeto: cada regra existe por causa de
um documento real que quebrou a anterior.
"""
