relacionados = ["acervo-busca", "acervo-telas"]
padroes = [
  "apps/knowledge/extraction.py",
  "apps/knowledge/blocos.py",
  "apps/knowledge/conferencia.py",
  "apps/knowledge/flows.py",
  "apps/knowledge/tasks.py",
  "apps/knowledge/management/**",
  "docs/EXTRACAO.md",
  "worker-gpu/**",
  "tests/test_blocos.py",
  "tests/test_ingestao.py",
  "tests/test_conferencia.py",
]

